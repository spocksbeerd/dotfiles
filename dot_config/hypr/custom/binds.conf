bind = SUPER SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland

# Apps
bind = SUPER, RETURN, exec, kitty
bind = SUPER, W,      exec, firefox
bind = SUPER, P,      exec, firefox --private-window

# DMS Apps
bind = SUPER, D,       exec, dms ipc call spotlight toggle
bind = SUPER, V,       exec, dms ipc call clipboard toggle
bind = SUPER SHIFT, V, exec, dms clipboard clear
bind = SUPER, N,       exec, dms ipc call notifications toggle
bind = SUPER, comma,   exec, dms ipc call settings focusOrToggle
bind = SUPER SHIFT, N, exec, dms ipc call notepad toggle
bind = SUPER SHIFT, W, exec, dms ipc call dankdash wallpaper
bind = SUPER SHIFT, Q, exec, dms ipc call powermenu toggle
bind = SUPER, F4,      exec, dms ipc call powermenu toggle
bind = SUPER, TAB,     exec, dms ipc call hypr toggleOverview

# Keyboard Layout
bind = SUPER, SPACE, exec, switch_kb_layout.sh

# Security
bind = SUPER, X,         exec, dms ipc call lock lock
bind = SUPER SHIFT, R,   exec, hyprctl reload
bind = SUPER SHIFT, E,   exit
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle

# Audio Controls
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5
bindl  = , XF86AudioMute,        exec, dms ipc call audio mute
bindel = SUPER, Up,              exec, dms ipc call audio increment 5
bindel = SUPER, Down,            exec, dms ipc call audio decrement 5
bindl  = SUPER, M,               exec, dms ipc call audio mute

bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioPause, exec, dms ipc call mpris playPause
bindl = , XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = , XF86AudioPrev, exec, dms ipc call mpris previous
bindl = , XF86AudioNext, exec, dms ipc call mpris next
bindel = CTRL, XF86AudioRaiseVolume, exec, dms ipc call mpris increment 3
bindel = CTRL, XF86AudioLowerVolume, exec, dms ipc call mpris decrement 3

# Brightness Controls
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# Magnifier
binde = SUPER, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
binde = SUPER, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind  = SUPER, code:22, exec, hyprctl -q keyword cursor:zoom_factor 1

# Screenshot
$dir = "$HOME/Pictures/screenshots"
bind = SUPER, S,       exec, dms screenshot -d $dir
bind = SUPER SHIFT, S, exec, dms screenshot full -d $dir
bind = SUPER CTRL, S,  exec, dms screenshot window -d $dir
bind = , Print,        exec, dms screenshot -d $dir
bind = SHIFT, Print,   exec, dms screenshot full -d $dir
bind = CTRL, Print,    exec, dms screenshot window -d $dir

# Window Management
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, fullscreen, 1
bind = SUPER SHIFT, SPACE, togglefloating
bind = SUPER SHIFT, P, pin
bind = SUPER, R, layoutmsg, togglesplit
# bind = SUPER SHIFT, W, exec, dms ipc call window-rules toggle

# Focus Navigation
binde = SUPER, H, movefocus, l
binde = SUPER, J, movefocus, d
binde = SUPER, K, movefocus, u
binde = SUPER, L, movefocus, r

# Window Movement
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Monitor Navigation
bind = SUPER CTRL, H, focusmonitor, l
bind = SUPER CTRL, J, focusmonitor, d
bind = SUPER CTRL, K, focusmonitor, u
bind = SUPER CTRL, L, focusmonitor, r

# Move to Monitor
bind = SUPER SHIFT CTRL, H, movewindow, mon:l
bind = SUPER SHIFT CTRL, J, movewindow, mon:d
bind = SUPER SHIFT CTRL, K, movewindow, mon:u
bind = SUPER SHIFT CTRL, L, movewindow, mon:r

# Workspace Management
bind = CTRL SHIFT, R, exec, dms ipc call workspace-rename open

# Workspace Navigation
bind = SUPER, O, workspace, e+1
bind = SUPER, I, workspace, e-1
bind = SUPER SHIFT, O, movetoworkspace, e+1
bind = SUPER SHIFT, I, movetoworkspace, e-1
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Special Workspaces
bind = SUPER,       GRAVE, togglespecialworkspace, special
bind = SUPER SHIFT, GRAVE, movetoworkspacesilent,  special

# Numbered Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move to Numbered Workspaces
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# Manual Resizing
binde = SUPER CTRL, LEFT,  resizeactive, -20 0
binde = SUPER CTRL, DOWN,  resizeactive, 0 20
binde = SUPER CTRL, UP,    resizeactive, 0 -20
binde = SUPER CTRL, RIGHT, resizeactive, 20 0
